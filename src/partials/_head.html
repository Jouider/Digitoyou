<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- SEO: Meta Info -->
  <title>Digitoyou- Sites web sur-mesure & performants</title>
  <meta name="description" content="Digitoyou crée des sites web puissants, 100% personnalisés, conçus pour convertir. Livraison rapide, support réactif, zéro frais cachés.">
  <meta name="keywords" content="digitoyou, création site web, site vitrine, site e-commerce, agence web, développement web, UX design, SEO, landing page, site personnalisé, freelance, startup, PME">
  <meta name="author" content="Digitoyou" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (réseaux sociaux) -->
  <meta property="og:title" content="Digitoyou - Sites web performants et sur-mesure">
  <meta property="og:description" content="Sites modernes, optimisés pour la conversion. Maintenance offerte, support rapide et expérience utilisateur fluide.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.digitoyou.com">
  <meta property="og:image" content="https://www.digitoyou.com/assets/img/og-image.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Digitoyou - Sites web sur-mesure">
  <meta name="twitter:description" content="Des sites pensés pour convertir. Sur-mesure, rapide et sans surprise.">
  <meta name="twitter:image" content="https://www.digitoyou.com/assets/img/og-image.jpg">

  <!-- Favicon -->
  <link rel="icon" href="@@webRoot/assets/img/favicon.png" type="image/png">

  <!-- Styles (load asynchronously to avoid render-blocking) -->
  <!-- Load non-critical vendor CSS in a non-blocking way to reduce initial parse cost -->
  <link href="@@webRoot/assets/css/plugins.css" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="@@webRoot/assets/css/plugins.css"></noscript>

  <link rel="preload" href="@@webRoot/assets/css/style.css" as="style" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="@@webRoot/assets/css/style.css"></noscript>

  <!-- NOTE: For more savings, split plugins.css into a small plugins-critical.css (only the vendor rules
       that are required for above-the-fold) and a plugins-async.css loaded with the media=print trick.
       Also consider running PurgeCSS on your compiled CSS during build to remove unused selectors. -->

</head>
