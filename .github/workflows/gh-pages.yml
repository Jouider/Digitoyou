name: Deploy to Hosting

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Configure Slack webhook (optional)
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            mkdir -p src/assets/php
            printf "<?php\nreturn [\n    'SLACK_WEBHOOK_URL' => '%s',\n];\n" "${{ secrets.SLACK_WEBHOOK_URL }}" > src/assets/php/slack-config.php
          else
            echo "SLACK_WEBHOOK_URL secret not set; skipping"
          fi

      - name: Build project
        run: npm run build

      - name: Deploy to STAGING (FTPS explicit:21)
        if: github.ref != 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          exclude: |
            **/.git*
            **/node_modules/**
            assets/js/config.js
            assets/img/svg/scribble.svg
            assets/img/svg/tri.svg
          dangerous-clean-slate: false
          server-dir: /staging_html/
          log-level: verbose

      - name: Deploy to PRODUCTION (FTPS explicit:21)
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          exclude: |
            **/.git*
            **/node_modules/**
            assets/js/config.js
            assets/img/svg/scribble.svg
            assets/img/svg/tri.svg
          dangerous-clean-slate: false
          server-dir: /public_html/
          log-level: verbose

